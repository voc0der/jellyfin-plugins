name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '20 5 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    # Nothing here is compiled, so neither language needs a build. The shell
    # scripts are not covered: CodeQL has no extractor for them.
    strategy:
      fail-fast: false
      matrix:
        include:
          # The workflows, including update-manifest.yml, which pushes to main.
          - language: actions
            build-mode: none
          # The screenshot harness.
          - language: javascript
            build-mode: none

    steps:
    - uses: actions/checkout@v7

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4.38.0
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        queries: security-and-quality

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4.38.0
      with:
        category: '/language:${{ matrix.language }}'
