name: Update plugin manifest

on:
  repository_dispatch:
    types:
      - plugin-updated
  # Keeps the README table honest when the sources or the generator change by
  # hand. The commit below carries [skip ci], so the workflow's own push does
  # not trigger another run.
  push:
    branches:
      - main
    paths:
      - README.md
      - manifest.json
      - sources.txt
      - scripts/build-manifest.sh
      - scripts/build-readme.sh
      - .github/workflows/update-manifest.yml
  workflow_dispatch:

permissions:
  contents: write

# A dispatch only means "something changed", so collapsing a burst of pending runs is
# safe: every run rebuilds all sources instead of trusting data from the caller.
concurrency:
  group: update-plugin-manifest
  cancel-in-progress: false

jobs:
  update-manifest:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Generate and validate manifest
      run: scripts/build-manifest.sh sources.txt generated-manifest.json

    - name: Regenerate catalogue and README
      run: |
        mv generated-manifest.json manifest.json
        scripts/build-readme.sh sources.txt manifest.json README.md

    - name: Publish changes
      run: |
        git add manifest.json README.md

        if git diff --cached --quiet; then
          echo "No catalogue changes"
          exit 0
        fi

        git config user.name "voc0der"
        git config user.email "contact@netspace.in"
        git commit -m "chore: update plugin catalogue [skip ci]"
        git push
