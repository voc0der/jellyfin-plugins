name: Update plugin manifest

on:
  repository_dispatch:
    types:
      - plugin-updated
  # Keeps the README table honest when the sources or the generator change by
  # hand. The commit below carries [skip ci], so the workflow's own push does
  # not trigger another run.
  push:
    branches:
      - main
    paths:
      - README.md
      - manifest.json
      - sources.txt
      - scripts/build-manifest.sh
      - scripts/build-readme.sh
      - scripts/publish-catalogue.sh
      - .github/workflows/update-manifest.yml
  # A safety net, not the main path. Dispatches are collapsed by the concurrency
  # group below, so if the last run of a release burst fails, or a plugin's
  # dispatch never arrives, nothing else would notice the catalogue had gone
  # stale. A daily rebuild is a no-op whenever the catalogue is already correct.
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  # How long a dispatch waits before rebuilding, to let the rest of a release
  # burst arrive. See the settle step below.
  SETTLE_SECONDS: 30

# A dispatch only means "something changed", so collapsing a burst of pending runs is
# safe: every run rebuilds all sources instead of trusting data from the caller, which
# also means the run that pushes last publishes a complete catalogue, not a partial one.
concurrency:
  group: update-plugin-manifest
  cancel-in-progress: false

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    # A hung run holds the concurrency group, and every dispatch that queues
    # behind it is collapsed away rather than kept, so failing fast loses less
    # than waiting out the six hour default.
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7

    # Releasing several plugins at once dispatches this workflow once per plugin,
    # seconds apart. Pausing before the rebuild lets the rest of the burst arrive
    # and collapse into the single pending run the concurrency group allows, so
    # the burst publishes one complete catalogue instead of a partial one per
    # plugin, and every source has had time to land before anything reads it.
    - name: Let a release burst settle
      if: github.event_name == 'repository_dispatch'
      run: sleep "$SETTLE_SECONDS"

    - name: Publish catalogue and README
      env:
        # Lets build-manifest.sh read each source through the contents API
        # instead of the raw CDN, which can serve a copy of a source manifest
        # that predates the release this run was dispatched for.
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        git config user.name "voc0der"
        git config user.email "contact@netspace.in"
        scripts/publish-catalogue.sh sources.txt manifest.json README.md
